server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta → index.html
    location / {
        try_files $uri /index.html;
    }

    # Archivos estáticos
    location /assets/ {
        try_files $uri =404;
    }
}

